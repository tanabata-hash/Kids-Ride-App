<!DOCTYPE html>
<html lang="ja">
<head>

    <meta name="robots" content="noindex, nofollow">
    
    <!-- OGP設定 (SNS共有時の表示設定) -->

    <meta property="og:image" content="https://kidsride.jp/ogp-image.png">
    <meta property="og:site_name" content="KidsRide">
    <meta property="og:locale" content="ja_JP">
    
    <!-- Twitter / X Card 設定 -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="KidsRide - 子ども送迎代行アプリ">
    <meta name="twitter:description" content="地域の信頼できる保護者や送迎者と繋がる、安心・安全な子ども送迎代行プラットフォーム。">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Phosphor Icons -->

    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Content gets injected here by app.js -->
    </div>
